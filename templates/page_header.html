{% load static %}

<header class="bg-white border-b border-b border-slate-200 shadow-sm">

    <div class="max-w-4xl mx-auto px-4">

        <div class="flex flex-col gap-3 py-4 md:flex-row md:items-center">

            <a
                    href="{% url 'articles:home' %}"
                    class="shrink-0"
            >
                <img
                        src="{% static 'images/logo.svg' %}"
                        alt="WebCraft"
                        class="h-8 w-auto"
                >
            </a>

            <div class="flex flex-col gap-3 md:flex-row md:items-center md:ml-auto">

                <form
                        action="{% url 'articles:search' %}"
                        method="get"
                        class="w-full md:w-72"
                >
                    <div class="flex">
                        <input
                                type="text"
                                name="q"
                                placeholder="Поиск..."
                                class="w-full px-3 py-2 text-sm border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

                        <button
                                type="submit"
                                class="px-4 py-2 bg-gray-100 border border-l-0 border-gray-300 rounded-r-lg hover:bg-gray-200 transition"
                        >
                            <i data-lucide="search" class="w-5 h-5"></i>
                        </button>
                    </div>
                </form>

                <div class="text-sm text-gray-500 whitespace-nowrap">
                    {% now "d E Y" %} • {% now "l" %}
                </div>

            </div>

        </div>

        <nav class="pb-4 overflow-x-auto scrollbar-hide">

            <ul class="flex gap-2 min-w-max">

                {% for category in menu_categories %}
                <li>
                    <a
                            href="{% url 'articles:category_detail' category.slug %}"
                            class="inline-flex items-center px-4 py-2 text-sm font-semibold text-gray-700 bg-gray-100 rounded-full hover:bg-blue-50 hover:text-blue-600 transition"
                    >
                        {{ category.title }}
                    </a>
                </li>
                {% endfor %}

            </ul>

        </nav>

    </div>

</header>
