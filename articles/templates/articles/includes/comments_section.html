<section class="mt-8 bg-white rounded-xl shadow-sm p-6 md:p-8">
    <h2 class="text-2xl font-semibold mb-6">Комментарии</h2>
    <div id="comments-section">
        <form id="comment-form" class="space-y-5">
            {% csrf_token %}
            <div>
                <label for="author_name" class="block text-sm font-medium text-gray-700 mb-2"> Ваше имя </label>
                <input type="text" id="author_name" name="author_name" maxlength="100" required class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="text" class="block text-sm font-medium text-gray-700 mb-2"> Комментарий </label>
                <textarea id="text" name="text" rows="5" required class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-y"></textarea>
            </div>
            <button type="submit"
                    class="inline-flex items-center rounded-lg bg-blue-600 px-5 py-3 text-white font-medium hover:bg-blue-700 transition-colors">
                Отправить комментарий
            </button>
        </form>
        <div
                id="comment-success"
                class="hidden mt-4 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-green-700"
        >
            Комментарий успешно добавлен
        </div>

        <div class="border-t border-gray-200 my-8"></div>
        <div id="comments-container" class="space-y-4">
            <p class="text-gray-500">Пока нет комментариев</p>
        </div>
    </div>
</section>
