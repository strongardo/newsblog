<ul>
    {% for article in articles %}
    <li>
        <a href="{% url 'articles:article_detail' article.slug %}">
            {{ article.title }}
        </a>
        <a href="{% url 'articles:category_detail' article.category.slug %}">
            {{ article.category.title }}
        </a>
    </li>
    {% endfor %}
</ul>
