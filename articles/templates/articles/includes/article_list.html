<ul class="space-y-6">

    {% for article in articles %}

    <li class="bg-white rounded-xl shadow-sm overflow-hidden">

        <div class="md:flex">

            {% if article.image %}
            <a
                    href="{% url 'articles:article_detail' article.slug %}"
                    class="md:w-1/3"
            >
                <img
                        src="{{ article.image.url }}"
                        alt="{{ article.title }}"
                        class="w-full h-56 md:h-full object-cover"
                >
            </a>
            {% endif %}

            <div class="p-5 md:w-2/3">

                <a
                        href="{% url 'articles:category_detail' article.category.slug %}"
                        class="inline-block px-3 py-1 text-xs font-medium bg-gray-100 text-gray-600 rounded-full hover:bg-gray-200 transition-colors"
                >
                    {{ article.category.title }}
                </a>

                <h2 class="mt-2">
                    <a
                            href="{% url 'articles:article_detail' article.slug %}"
                            class="text-2xl font-semibold text-gray-900 hover:text-gray-700 transition-colors"
                    >
                        {{ article.title }}
                    </a>
                </h2>

                <p class="mt-3 text-gray-600">
                    {{ article.content|truncatechars:180 }}
                </p>

            </div>

        </div>

    </li>

    {% endfor %}

</ul>
