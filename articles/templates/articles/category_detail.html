{% extends 'base.html' %}

{% block title %}
    {{ category.title }}
{% endblock %}

{% block content %}
    <h1>{{ category.title }}</h1>

    {% if articles %}
        <ul>
            {% for article in articles %}
                <li>
                    <a href="{% url 'articles:article_detail' article.slug %}">
                        {{ article.title }}
                    </a>
                    <a href="{% url 'articles:category_detail' category.slug %}">
                        {{ category.title }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Материалов пока нет</p>
    {% endif %}
{% endblock %}
